[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-bus-mcp"
version = "0.1.0"
description = "Let ChatGPT and Codex delegate to a local agent bus through MCP."
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0"]

[project.scripts]
agent-bus-mcp = "agent_bus_mcp.server:main"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bus_mcp"]
